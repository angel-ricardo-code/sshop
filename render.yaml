services:
  - type: web
    name: sshop-web
    env: docker
    branch: dev
    dockerfilePath: Dockerfile
    autoDeploy: true
    region: oregon
    plan: starter
    # startCommand overrides the Dockerfile CMD to run PHP built-in server with a router
    startCommand: "php -S 0.0.0.0:$PORT -t public server.php"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: 'false'
      - key: APP_KEY
        generate: true
      - key: APP_URL
        value: https://your-app.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: <DB_HOST>
      - key: DB_PORT
        value: '5432'
      - key: DB_DATABASE
        value: <DB_NAME>
      - key: DB_USERNAME
        value: <DB_USER>
      - key: DB_PASSWORD
        value: <DB_PASSWORD>
    healthCheckPath: /

